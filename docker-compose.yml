services:
  # Apache Kafka in single-node KRaft mode (no ZooKeeper process required).
  kafka:
    image: apache/kafka-native:3.9.1
    hostname: kafka
    container_name: lightning-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - lightning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': >/dev/tcp/127.0.0.1/29092'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Redis Cache
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: lightning-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - lightning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  prediction-service:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: lightning-prediction-service
    init: true
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: lightning-strikes
      KAFKA_OUTPUT_TOPIC: lightning-predictions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_DIR: /app/data/models
    networks:
      - lightning-network
    restart: unless-stopped

  dashboard-api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["dashboard"]
    init: true
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.dashboard.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8765:8000"
    networks:
      - lightning-network
    restart: unless-stopped

  live-producer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["live"]
    init: true
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "-m", "src.streaming.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: lightning-strikes
    networks:
      - lightning-network
    restart: unless-stopped

  # Kafka UI (optional - for monitoring)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lightning-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lightning-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - lightning-network
    restart: unless-stopped
    profiles: ["tools"]

  # Redis Commander (optional - for monitoring Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: lightning-redis-commander
    depends_on:
      - redis
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - lightning-network
    restart: unless-stopped
    profiles: ["tools"]

  benchmark:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["benchmark"]
    depends_on:
      prediction-service:
        condition: service_started
    command: ["python", "-m", "src.streaming.benchmark", "--events", "1000", "--rate", "100"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: lightning-strikes
      KAFKA_OUTPUT_TOPIC: lightning-predictions
      BENCHMARK_OUTPUT: /results/benchmark-results.json
    volumes:
      - .:/results
    working_dir: /app
    networks:
      - lightning-network

networks:
  lightning-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
